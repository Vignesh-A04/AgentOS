services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: agentos-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: agentos-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped